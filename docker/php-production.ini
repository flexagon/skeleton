; On top of php.ini-production, in the alpha, beta and production images only.

expose_php = Off

; The code in the image never changes, so opcache never has to look again.
opcache.validate_timestamps = 0

; Flexagon reads doc block annotations (@encrypt, @db_auto_timestamp) at
; runtime. Without the comments they are ignored, silently.
opcache.save_comments = 1

; Would write the compiled .env.php, secrets and all, to disk.
opcache.file_cache =
