ServerTokens Prod
ServerSignature Off

# Sized by docker/entrypoint.sh from the container's memory limit; override
# with APACHE_MAX_REQUEST_WORKERS. Loaded after mods-enabled/mpm_prefork.conf,
# so these win over Debian's defaults.
<IfModule mpm_prefork_module>
    ServerLimit             ${APACHE_PREFORK_WORKERS}
    MaxRequestWorkers       ${APACHE_PREFORK_WORKERS}
    StartServers            ${APACHE_PREFORK_START}
    MinSpareServers         ${APACHE_PREFORK_MIN_SPARE}
    MaxSpareServers         ${APACHE_PREFORK_MAX_SPARE}
    MaxConnectionsPerChild  ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>

# The only site in the container. No ServerName: it answers every host name,
# and FLEXAGON_PUBLIC picks the directory (checked by docker/entrypoint.sh).
<VirtualHost *:${PORT}>
    DocumentRoot /app/${FLEXAGON_PUBLIC}
    <Directory /app/${FLEXAGON_PUBLIC}>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
