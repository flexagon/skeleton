# Where each stage is built. Default: build/deploy/<stage>. An output
# directory is emptied before each build, so give each one a directory of its
# own; -Ddeploy.dir=DIR on the command line wins over these.
# deploy.dir.alpha       = /srv/deploy/myapp-alpha
# deploy.dir.beta        = /srv/deploy/myapp-beta
# deploy.dir.production  = /srv/deploy/myapp-production

# Commands, when they are not on the PATH.
# composer = /usr/local/bin/composer   (default: composer.phar beside build.xml, else composer)
# php      = /usr/local/bin/php
